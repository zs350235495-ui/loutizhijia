  <style>
    .err-container {
      max-width: 720px;
      margin: 80px auto;
      padding: 40px 24px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .err-code {
      font-size: 5rem;
      font-weight: 900;
      color: #f59e0b;
      font-family: 'Fira Code', monospace;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .err-title {
      font-size: 1.5rem;
      color: #f8fafc;
      margin-bottom: 16px;
    }
    .err-desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .err-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      text-align: left;
      margin-bottom: 32px;
    }
    .err-link-item {
      display: block;
      padding: 12px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .err-link-item:hover {
      background: #334155;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    .err-btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .err-btn-home:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.4);
    }
  </style>

  <!-- 智能路由自愈脚本 -->
  <script>
    (function() {
      var path = window.location.pathname || '';
      var search = window.location.search || '';
      // 捕获 /post/82 或 ?post=82 形式并自愈重定向
      var matchId = path.match(/\/post\/(\d+)(?:\.html)?/) || search.match(/post=(\d+)/);
      if (matchId && matchId[1]) {
        window.location.replace('/post/' + matchId[1] + '.html');
        return;
      }
      // 捕获 /# 遗留路由
      if (path === '/' && window.location.hash.startsWith('#/post/')) {
        var hashId = window.location.hash.replace('#/post/', '').split('?')[0];
        if (hashId) {
          window.location.replace('/post/' + hashId + '.html');
        }
      }
    })();
  </script>
</head>

</html>
