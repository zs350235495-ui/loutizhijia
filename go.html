      position: relative;

      left: 0;
      right: 0;

      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .radar-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--runway-yellow);
      animation: pulseAnim 2s infinite;
      opacity: 0;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .goose-emoji {

    }
    .dispatch-title {

      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.5px;

      font-weight: 600;

      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
      position: relative;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--runway-yellow), var(--goose-orange));
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-direct {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, var(--runway-yellow) 0%, var(--runway-orange) 100%);

      font-weight: 700;
      font-size: 15px;
      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;

    .security-notice svg {
      width: 14px;
      height: 14px;
      stroke: var(--status-green);

  </style>
</head>
