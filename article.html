<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, follow">
  <title>正在定位航标黑匣子...</title>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var post = params.get('post') || params.get('id') || params.get('article') || '100';
      // 静默重定向至独立静态文章 Clean URL，杜绝死循环跳转
      window.location.replace('/post/' + encodeURIComponent(post) + '.html');
    })();
  </script>
</head>

</body>
</html>
