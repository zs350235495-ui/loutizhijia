  <title>正在定位航标黑匣子... - 梯子之家</title>

    (function() {

      var post = params.get('post') || params.get('id') || params.get('article') || '100';
      // 静默重定向至独立静态文章 Clean URL，杜绝死循环跳转
      window.location.replace('/post/' + encodeURIComponent(post) + '.html');
    })();
  </script>
